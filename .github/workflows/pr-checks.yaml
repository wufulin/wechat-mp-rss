name: PR Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string
      skip_docker_build:
        description: Skip the CI image build when the caller builds the release image next
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run backend regression tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Check Python compilation
        run: >-
          uv run --locked python -m compileall -q
          apis core driver jobs schemas tools qtserver main.py web.py

      - name: Check development startup script
        run: bash -n start_dev.sh

      - name: Check release and deployment scripts
        run: |
          python scripts/check-release-version.py
          bash -n scripts/deploy-production.sh

      - name: Validate Docker Compose files
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.app-only.yml config --quiet

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.8.0"
          cache: pnpm
          cache-dependency-path: web_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web_ui
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: web_ui
        run: pnpm typecheck

      - name: Build frontend
        working-directory: web_ui
        run: pnpm build

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.8.0"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Validate docs
        working-directory: docs-site
        run: npm run check:docs

      - name: Build docs site
        working-directory: docs-site
        env:
          VITE_BASE_PATH: /werss/
        run: npm run build

  docker:
    name: Docker image build
    if: ${{ !inputs.skip_docker_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: werss:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
